name: Front door

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: front-door-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build front door
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_front_door.py --out index.html

      - name: Fail if index.html is out of date
        run: |
          if ! git diff --quiet -- index.html; then
            echo "index.html does not match the generator's output."
            echo "The release pipeline refreshes it when it publishes documentation."
            git --no-pager diff -- index.html
            exit 1
          fi
          echo "index.html is up to date."
